[package]
name = "winkioskshell"
edition = "2021"
build = "build.rs"

[dependencies]
slint = "1.8"
dirs = "5.0"
winreg = { version = "0.52", optional = true }
lazy_static = "1.5"
rfd = "0.15"
mslnk = { version = "0.1", optional = true }
sysinfo = "0.33"
whoami = "1.5"
self-replace = "1.4"
semver = "1.0"
reqwest = { version = "0.12", features = ["blocking", "json"] }
winapi = { version = "0.3", features = ["winnt", "processthreadsapi", "processenv", "securitybaseapi"], optional = true }
confy = { version = "0.6", features = ["ron_conf"], default-features = false }
serde = { version = "1.0", features = ["derive"] }

[build-dependencies]
regex = "1"
slint-build = "1.8"
embed-resource = { version = "3.0", optional = true }
